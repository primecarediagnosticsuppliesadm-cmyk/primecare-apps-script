# PN-EMAIL Stage 1 — automated Production release (DRY_RUN / PR certification)
#
# Schedule is DISABLED until a later enablement gate.
# Recommended window after the daily ~10:24–10:32 UTC physical backup:
#   schedule:
#     - cron: "45 10 * * *"
#
# GitHub registers workflow_dispatch only after this file exists on the default
# branch. pull_request lets CI certify DRY_RUN before that merge.
# This workflow never applies Production migrations, never deploys Edge/Vercel,
# never promotes main, and never enables EMAIL_ENABLED.

name: PN-EMAIL Stage 1 Auto Release

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/pn-email-stage1-auto-release.yml"
      - "primecare-portal/scripts/release/**"
      - "primecare-portal/docs/operations/PN_EMAIL_STAGE1_AUTO_RELEASE.md"
      - "primecare-portal/package.json"
  workflow_dispatch:
    inputs:
      note:
        description: "This workflow always runs DRY_RUN regardless of note text"
        required: false
        default: "dry-run"

concurrency:
  group: primecare-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Stage 1 DRY_RUN (no Production mutation)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: primecare-portal
    env:
      PN_EMAIL_STAGE1_CI_FORCE_DRY_RUN: "true"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: primecare-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch release identity refs
        run: |
          git fetch origin main release/pn-email-prod-candidate

      - name: Main-drift classifier tests
        run: node scripts/release/pnEmailMainDrift.test.mjs

      - name: PN-EMAIL Stage 1 DRY_RUN
        run: node scripts/release/pn-email-stage1-auto-release.mjs --dry-run
