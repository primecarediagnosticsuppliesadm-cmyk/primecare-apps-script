name: Architecture Enforcement

on:
  pull_request:
    paths:
      - "primecare-portal/**"
      - "docs/Architecture/**"
  push:
    branches: [main, master]
    paths:
      - "primecare-portal/**"
      - "docs/Architecture/**"

jobs:
  enforce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: primecare-portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: primecare-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (bundle size check)
        run: npm run build

      - name: Architecture enforcement — PR profile
        env:
          ENFORCEMENT_MODE: incremental
        run: node scripts/enforcement/run-architecture-enforcement.mjs --profile pr --all

      - name: Upload enforcement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-enforcement-report
          path: docs/Architecture/Enforcement/reports/enforcement-pr-*.json
          if-no-files-found: ignore

  bounded-reads-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: primecare-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/verify-bounded-reads.mjs
